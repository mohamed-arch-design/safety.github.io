services:
  - type: web
    name: tricel-safety-workspace
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    disk:
      name: tricel-safety-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATA_DIRECTORY
        value: /var/data/tricel-safety-workspace
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
